name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout private project
        uses: actions/checkout@v4

      - name: Get Cake Wallet source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf cake_wallet
          git clone --depth 1 https://github.com/cake-tech/cake_wallet.git cake_wallet
          cd cake_wallet
          git fetch --depth 1 origin 6df6108d37d3e4b2cbbd2968d3728dc8310fdf60
          git checkout --detach 6df6108d37d3e4b2cbbd2968d3728dc8310fdf60
          cd ..
          echo "Cake Wallet commit:"
          git -C cake_wallet rev-parse HEAD
          test "$(git -C cake_wallet rev-parse HEAD)" = "6df6108d37d3e4b2cbbd2968d3728dc8310fdf60"
          test -f cake_wallet/pubspec.yaml
          test -f cake_wallet/ios/Runner.xcodeproj/project.pbxproj
          test -f cake_wallet/scripts/ios/app_env.sh
          test -f cake_wallet/scripts/ios/app_config.sh
          test -f balance_row_widget.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Set up Apple build environment
        shell: bash
        run: |
          set -euxo pipefail
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          flutter --version
          pod --version

      - name: Install native tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install automake ccache cmake go libtool pkgconfig xz || true
          rustup default stable

      - name: Apply existing customization
        shell: bash
        run: |
          set -euxo pipefail
          TARGET="cake_wallet/lib/src/screens/dashboard/pages/balance/balance_row_widget.dart"
          test -f "$TARGET"
          cp balance_row_widget.dart "$TARGET"

      - name: Configure Cake Wallet
        working-directory: cake_wallet/scripts/ios
        shell: bash
        run: |
          set -euxo pipefail
          source ./app_env.sh cakewallet
          ./app_config.sh

      - name: Build native dependencies
        working-directory: cake_wallet/scripts/ios
        shell: bash
        run: |
          set -euxo pipefail
          ./build_monero_all.sh
          ./build_mwebd.sh
          ./build_decred.sh

      - name: Prepare Flutter project
        working-directory: cake_wallet
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get
          dart run tool/generate_new_secrets.dart
          dart run tool/generate_localization.dart
          ./model_generator.sh

      - name: Install CocoaPods
        working-directory: cake_wallet/ios
        shell: bash
        run: |
          set -euxo pipefail
          pod install --repo-update

      - name: Build unsigned iOS release
        working-directory: cake_wallet
        shell: bash
        run: |
          set -euxo pipefail
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app
          test -f build/ios/iphoneos/Runner.app/Info.plist

      - name: Create and validate IPA
        working-directory: cake_wallet
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf Payload CakeWallet.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload CakeWallet.ipa
          test -s CakeWallet.ipa
          unzip -tq CakeWallet.ipa
          unzip -l CakeWallet.ipa | grep -F 'Payload/Runner.app/Info.plist' >/dev/null

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CakeWallet-IPA
          path: cake_wallet/CakeWallet.ipa
          if-no-files-found: error
          retention-days: 7
