name: Build iOS IPA
on: [workflow_dispatch] # Allows you to trigger the build manually

jobs:
  build:
    name: Compile Flutter Application
    runs-on: macos-latest # Borrow a virtual cloud Mac from GitHub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Unsigned iOS App Bundle
        run: flutter build ios --no-codesign --release

      - name: Package into IPA Format
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r CakeWallet.ipa Payload
          rm -rf Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CustomCakeWallet
          path: CakeWallet.ipa
