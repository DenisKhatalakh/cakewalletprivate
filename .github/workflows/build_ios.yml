name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Cake Wallet iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout private customization
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout matching Cake Wallet source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/cake-tech/cake_wallet.git cake_wallet
          cd cake_wallet
          git fetch --depth 1 origin 6df6108d37d3e4b2cbbd2968d3728dc8310fdf60
          git checkout --detach 6df6108d37d3e4b2cbbd2968d3728dc8310fdf60
          test -f pubspec.yaml
          test -d ios
          test -f scripts/ios/app_config.sh

      - name: Install Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install automake ccache cmake cocoapods go libtool pkgconfig xz
          sudo softwareupdate --install-rosetta --agree-to-license || true
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Apply existing private customization
        shell: bash
        run: |
          set -euxo pipefail
          test -f balance_row_widget.dart
          cp balance_row_widget.dart cake_wallet/lib/src/screens/dashboard/pages/balance/balance_row_widget.dart
          test -f cake_wallet/lib/src/screens/dashboard/pages/balance/balance_row_widget.dart

      - name: Configure iOS app
        working-directory: cake_wallet/scripts/ios
        shell: bash
        run: |
          set -euxo pipefail
          source ./app_env.sh cakewallet
          ./app_config.sh

      - name: Build native dependencies
        working-directory: cake_wallet/scripts/ios
        shell: bash
        run: |
          set -euxo pipefail
          ./build_monero_all.sh
          ./build_mwebd.sh
          ./build_decred.sh

      - name: Install Flutter dependencies and generate sources
        working-directory: cake_wallet
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          flutter pub get
          dart run tool/generate_new_secrets.dart
          dart run tool/generate_localization.dart
          ./model_generator.sh

      - name: Install CocoaPods dependencies
        working-directory: cake_wallet/ios
        shell: bash
        run: |
          set -euxo pipefail
          pod install --repo-update

      - name: Build unsigned iOS release
        working-directory: cake_wallet
        shell: bash
        run: |
          set -euxo pipefail
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app

      - name: Package valid IPA
        working-directory: cake_wallet
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf Payload CakeWallet.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          /usr/bin/zip -qry CakeWallet.ipa Payload
          test -s CakeWallet.ipa
          unzip -tq CakeWallet.ipa
          unzip -l CakeWallet.ipa | grep -F 'Payload/Runner.app/' >/dev/null

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CakeWallet-IPA
          path: cake_wallet/CakeWallet.ipa
          if-no-files-found: error
          retention-days: 7
